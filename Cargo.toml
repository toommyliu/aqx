[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
aqx-core = { path = "crates/aqx-core" }
aqx-protocol = { path = "crates/aqx-protocol" }
aqx-script = { path = "crates/aqx-script" }
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
flate2 = "1"
memchr = "2"
mio = { version = "1", features = ["os-poll", "net"] }
ratatui = "0.30"
rquickjs = { version = "0.14", features = ["loader"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
swc_common = "27"
swc_ts_fast_strip = "60"
toml = "1"
ureq = "3"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
