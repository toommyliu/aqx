[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
mira-protocol = { path = "crates/mira-protocol" }
mira-client = { path = "crates/mira-client" }
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
dirs = "6"
flate2 = "1"
getrandom = "0.2"
mio = { version = "1", features = ["net", "os-poll"] }
quick-xml = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = "3"
