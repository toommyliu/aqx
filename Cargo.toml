[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
mira-protocol = { path = "crates/mira-protocol" }
mira-client = { path = "crates/mira-client" }
mira-script = { path = "crates/mira-script" }
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
dirs = "6"
flate2 = "1"
getrandom = "0.2"
libc = "0.2"
mio = { version = "1", features = ["net", "os-poll"] }
quick-xml = "0.38"
ratatui = "0.30"
schemars = "1"
rquickjs = { version = "0.14", features = ["loader"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swc_common = "27"
swc_ecma_ast = "30"
swc_ecma_parser = "47"
swc_ecma_visit = "30"
swc_ts_fast_strip = "60"
tar = "0.4"
thiserror = "2"
toml = "1"
toml_edit = "0.25"
tui-input = "0.15"
unicode-width = "0.2"
ureq = "3"
